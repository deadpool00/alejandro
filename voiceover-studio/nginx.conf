server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the web UI
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to Kokoro (internal Docker network, never exposed publicly)
    location /v1/ {
        proxy_pass http://kokoro-tts:8880/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;          # long scripts on CPU can take a while
        proxy_send_timeout 300s;
        client_max_body_size 5m;
    }
}
